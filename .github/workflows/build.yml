name: Build NetForge
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish (x64, self-contained)
        run: dotnet publish NetForge/NetForge.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained true -o publish
      - name: Show XAML compiler errors
        if: failure()
        shell: pwsh
        run: Get-ChildItem -Recurse NetForge/obj -Filter output.json | ForEach-Object { Write-Host $_.FullName; Get-Content $_.FullName -Raw }
      - uses: actions/upload-artifact@v4
        with:
          name: NetForge-win-x64
          path: publish
